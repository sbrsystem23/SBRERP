<script>

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=(SBR['projects']||[]).filter(item=>JSON.stringify(item).toLowerCase().includes(q));
  document.getElementById('count-lbl').textContent=list.length+' items';
  const wrap=document.getElementById('list-wrap');
  if(!list.length){wrap.innerHTML=`<div class="empty" style="padding:60px"><div class="empty-icon">🏗️</div><div class="empty-text">No records found</div></div>`;return;}
  const keys=list.length>0?Object.keys(list[0]).filter(k=>k!=='items'&&k!=='systems'&&typeof list[0][k]!=='object').slice(0,6):[];
  wrap.innerHTML=`<table class="tbl"><thead><tr>`+keys.map(k=>`<th>`+k+`</th>`).join('')+`<th>Actions</th></tr></thead><tbody>`+
    list.slice(0,100).map((item,i)=>
      `<tr>`+keys.map(k=>`<td class="td-muted">`+escH(String(item[k]||'—'))+`</td>`).join('')+
      `<td><button class="btn btn-r btn-xs" onclick="del(`+i+`)">✕</button></td></tr>`
    ).join('')+`</tbody></table>`;
}
function openModal(){document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function del(i){showToast('Use the full editor for this page — coming soon','error');}

window.addEventListener('load',async function(){await initPage('projects','Projects',function(){if(typeof render==='function')render();});});
</script></body></html>
